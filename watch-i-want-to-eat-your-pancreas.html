<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Watch I Want to Eat Your Pancreas | REDGE HUB</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- WATCH SECTION -->

    <section class="watch-page">

        <div class="watch-container">

            <h1>Watch I Want to Eat Your Pancreas</h1>

            <p class="watch-subtitle">
                I Want to Eat Your Pancreas - Full Movie
            </p>


            <!-- CUSTOM VIDEO PLAYER -->

            <div
                class="custom-player"
                id="custom-player"
            >

                <video
                    id="anime-video"
                    src="videos/i-want-to-eat-your-pancreas.mp4"
                    poster="images/i-want-to-eat-your-pancreas.jpg"
                    preload="metadata"
                >
                    Your browser does not support video playback.
                </video>


                <!-- PLAYER CONTROLS -->

                <div class="player-controls">

                    <!-- PROGRESS -->

                    <div class="progress-row">

                        <span id="current-time">
                            00:00
                        </span>

                        <input
                            type="range"
                            id="progress-bar"
                            min="0"
                            max="100"
                            value="0"
                        >

                        <span id="duration">
                            00:00
                        </span>

                    </div>


                    <!-- CONTROL ROW -->

                    <div class="control-row">

                        <!-- MAIN CONTROLS -->

                        <div class="main-controls">

                            <!-- BACK 10 SECONDS -->

                            <button
                                class="control-btn"
                                type="button"
                                onclick="skipVideo(-10)"
                            >
                                &lt;&lt; 10
                            </button>


                            <!-- PLAY / PAUSE -->

                            <button
                                class="play-btn"
                                id="play-pause-btn"
                                type="button"
                                onclick="togglePlay()"
                            >
                                Play
                            </button>


                            <!-- FORWARD 10 SECONDS -->

                            <button
                                class="control-btn"
                                type="button"
                                onclick="skipVideo(10)"
                            >
                                10 &gt;&gt;
                            </button>

                        </div>


                        <!-- RIGHT CONTROLS -->

                        <div class="right-controls">

                            <!-- VOLUME -->

                            <div class="volume-control">

                                <button
                                    class="sound-btn"
                                    id="sound-button"
                                    type="button"
                                    onclick="toggleMute()"
                                >
                                    Sound
                                </button>


                                <input
                                    type="range"
                                    id="volume-bar"
                                    min="0"
                                    max="1"
                                    step="0.05"
                                    value="1"
                                >

                            </div>


                            <!-- SETTINGS -->

                            <div class="settings-area">

                                <button
                                    class="control-btn"
                                    type="button"
                                    onclick="toggleSettings()"
                                >
                                    Set
                                </button>


                                <!-- SPEED MENU -->

                                <div
                                    class="speed-menu"
                                    id="speed-menu"
                                >

                                    <p>
                                        Playback Speed
                                    </p>


                                    <button
                                        type="button"
                                        onclick="setSpeed(0.75, this)"
                                    >
                                        0.75x
                                    </button>


                                    <button
                                        type="button"
                                        class="selected-speed"
                                        onclick="setSpeed(1, this)"
                                    >
                                        Normal
                                    </button>


                                    <button
                                        type="button"
                                        onclick="setSpeed(1.25, this)"
                                    >
                                        1.25x
                                    </button>


                                    <button
                                        type="button"
                                        onclick="setSpeed(1.5, this)"
                                    >
                                        1.5x
                                    </button>


                                    <button
                                        type="button"
                                        onclick="setSpeed(2, this)"
                                    >
                                        2x
                                    </button>

                                </div>

                            </div>


                            <!-- FULLSCREEN -->

                            <button
                                class="control-btn"
                                type="button"
                                onclick="toggleFullscreen()"
                            >
                                Full
                            </button>

                        </div>

                    </div>

                </div>

            </div>


            <!-- VIDEO ERROR MESSAGE -->

            <p
                id="video-message"
                style="
                    color:#e50914;
                    margin-top:12px;
                    display:none;
                "
            ></p>


            <!-- BACK BUTTON -->

            <a
                href="i-want-to-eat-your-pancreas.html"
                class="back-btn"
            >
                Back to I Want to Eat Your Pancreas
            </a>

        </div>

    </section>


    <!-- FOOTER -->

    <footer>

        <p>
            Copyright 2026 REDGE HUB.
            All Rights Reserved.
        </p>

    </footer>


    <!-- JAVASCRIPT -->

    <script>

        /* =========================
           ELEMENTS
        ========================= */

        const video =
            document.getElementById("anime-video");

        const player =
            document.getElementById("custom-player");

        const playButton =
            document.getElementById("play-pause-btn");

        const soundButton =
            document.getElementById("sound-button");

        const progressBar =
            document.getElementById("progress-bar");

        const volumeBar =
            document.getElementById("volume-bar");

        const currentTimeText =
            document.getElementById("current-time");

        const durationText =
            document.getElementById("duration");

        const message =
            document.getElementById("video-message");


        /* =========================
           FORMAT TIME
        ========================= */

        function formatTime(seconds) {

            if (!isFinite(seconds)) {

                return "00:00";

            }

            const minutes =
                Math.floor(seconds / 60);

            const remainingSeconds =
                Math.floor(seconds % 60);

            return (
                String(minutes).padStart(2, "0")
                + ":"
                +
                String(remainingSeconds).padStart(2, "0")
            );

        }


        /* =========================
           PLAY / PAUSE
        ========================= */

        function togglePlay() {

            if (video.paused) {

                video.play();

            } else {

                video.pause();

            }

        }


        /* =========================
           SKIP VIDEO
        ========================= */

        function skipVideo(seconds) {

            if (!isNaN(video.duration)) {

                video.currentTime =
                    Math.max(
                        0,
                        Math.min(
                            video.currentTime + seconds,
                            video.duration
                        )
                    );

            }

            showControls();

        }


        /* =========================
           MUTE / UNMUTE
        ========================= */

        function toggleMute() {

            video.muted =
                !video.muted;

            soundButton.textContent =
                video.muted
                    ? "Muted"
                    : "Sound";

            showControls();

        }


        /* =========================
           SETTINGS
        ========================= */

        function toggleSettings() {

            document
                .getElementById("speed-menu")
                .classList
                .toggle("show-speed-menu");

            showControls();

        }


        /* =========================
           PLAYBACK SPEED
        ========================= */

        function setSpeed(
            speed,
            clickedButton
        ) {

            video.playbackRate =
                speed;


            document
                .querySelectorAll(
                    ".speed-menu button"
                )
                .forEach(
                    function(button) {

                        button.classList.remove(
                            "selected-speed"
                        );

                    }
                );


            clickedButton.classList.add(
                "selected-speed"
            );


            document
                .getElementById("speed-menu")
                .classList
                .remove(
                    "show-speed-menu"
                );

            showControls();

        }


        /* =========================
           FULLSCREEN
        ========================= */

        function toggleFullscreen() {

            if (!document.fullscreenElement) {

                player.requestFullscreen();

            } else {

                document.exitFullscreen();

            }

        }


        /* =========================
           VIDEO DURATION
        ========================= */

        video.addEventListener(
            "loadedmetadata",
            function() {

                durationText.textContent =
                    formatTime(
                        video.duration
                    );

            }
        );


        /* =========================
           VIDEO PROGRESS
        ========================= */

        video.addEventListener(
            "timeupdate",
            function() {

                currentTimeText.textContent =
                    formatTime(
                        video.currentTime
                    );


                if (video.duration) {

                    progressBar.value =
                        (
                            video.currentTime
                            /
                            video.duration
                        ) * 100;

                }

            }
        );


        /* =========================
           PROGRESS BAR
        ========================= */

        progressBar.addEventListener(
            "input",
            function() {

                if (video.duration) {

                    video.currentTime =
                        (
                            progressBar.value
                            /
                            100
                        )
                        *
                        video.duration;

                }

                showControls();

            }
        );


        /* =========================
           VOLUME
        ========================= */

        volumeBar.addEventListener(
            "input",
            function() {

                video.volume =
                    volumeBar.value;

                video.muted =
                    false;

                soundButton.textContent =
                    "Sound";

                showControls();

            }
        );


        /* =========================
           PLAY EVENT
        ========================= */

        video.addEventListener(
            "play",
            function() {

                playButton.textContent =
                    "Pause";

                startHideTimer();

            }
        );


        /* =========================
           PAUSE EVENT
        ========================= */

        video.addEventListener(
            "pause",
            function() {

                playButton.textContent =
                    "Play";

                clearTimeout(
                    hideControlsTimer
                );

                player.classList.remove(
                    "hide-controls"
                );

            }
        );


        /* =========================
           VIDEO END
        ========================= */

        video.addEventListener(
            "ended",
            function() {

                clearTimeout(
                    hideControlsTimer
                );

                player.classList.remove(
                    "hide-controls"
                );

            }
        );


        /* =========================
           VIDEO ERROR
        ========================= */

        video.addEventListener(
            "error",
            function() {

                message.style.display =
                    "block";

                message.textContent =
                    "Video file was not found or cannot be played.";

            }
        );


        /* =========================
           AUTO HIDE CONTROLS
        ========================= */

        let hideControlsTimer;


        function showControls() {

            clearTimeout(
                hideControlsTimer
            );

            player.classList.remove(
                "hide-controls"
            );


            if (!video.paused) {

                startHideTimer();

            }

        }


        function startHideTimer() {

            clearTimeout(
                hideControlsTimer
            );


            if (!video.paused) {

                hideControlsTimer =
                    setTimeout(
                        function() {

                            player.classList.add(
                                "hide-controls"
                            );

                        },
                        3000
                    );

            }

        }


        /* =========================
           MOUSE MOVE
        ========================= */

        player.addEventListener(
            "mousemove",
            function() {

                showControls();

            }
        );


        /* =========================
           MOUSE ENTER
        ========================= */

        player.addEventListener(
            "mouseenter",
            function() {

                showControls();

            }
        );


        /* =========================
           TOUCH
        ========================= */

        player.addEventListener(
            "touchstart",
            function() {

                showControls();

            }
        );

    </script>

</body>

</html>
